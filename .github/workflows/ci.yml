name: Simple CI/CD

on:
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main    

jobs:
  app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build backend
        run: docker build -t backend ./backend

      - name: Build frontend
        run: docker build -t frontend ./frontend

      - name: Run app
        run: docker compose up -d --build

      - name: Wait for services to be ready
        run: |
          echo "Waiting for backend..."
          for i in {1..15}; do
            curl -s http://localhost:3000/api/users && break
            echo "Attempt $i failed, retrying in 2s..."
            sleep 2
          done
          echo "Waiting for frontend..."
          for i in {1..15}; do
            curl -s http://localhost:8080 && break
            echo "Attempt $i failed, retrying in 2s..."
            sleep 2
           done
              
      - name: Test backend
        run: curl --fail http://localhost:3000/api/users

      - name: Test frontend
        run: curl --fail http://localhost:8080

      - name: Stop
        run: docker compose down